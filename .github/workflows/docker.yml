name: Publish Docker image

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

# One run per pull request or ref, covering the build and the live tests:
# a new commit on a pull request cancels the superseded run, and pushes queue.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests build the image in the live test job instead: a pull request
  # from a fork gets a read-only token, so it cannot push an image to hand over.
  push-to-ghcr:
    name: Build Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.vendor=Sandia National Laboratories
            org.opencontainers.image.authors=minimega dev team <minimega-dev@sandia.gov>
            org.opencontainers.image.url=https://sandia-minimega.github.io/minimega/
            org.opencontainers.image.documentation=https://sandia-minimega.github.io/minimega/
            org.opencontainers.image.description=minimega is a tool for launching and managing virtual machines
            org.opencontainers.image.licenses=GPL-3.0
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A fork uses the qemu-build image from its own registry.
      - name: Select QEMU image
        id: qemu
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version="$(sed -n 's/^ARG QEMU_VERSION="\([^"]*\)"$/\1/p' docker/qemu/Dockerfile)"
          revision="$(sed -n 's/^ARG QEMU_BUILD_REVISION="\([^"]*\)"$/\1/p' docker/qemu/Dockerfile)"
          if [ -z "${version}" ] || [ -z "${revision}" ]; then
            echo "::error::cannot read ARG QEMU_VERSION and ARG QEMU_BUILD_REVISION from docker/qemu/Dockerfile"
            exit 1
          fi
          echo "image=ghcr.io/${OWNER,,}/qemu-build:${version}-noble-${revision}" >> "$GITHUB_OUTPUT"
      # A push to master that changes docker/qemu/ also starts the workflow
      # that publishes the new qemu-build tag, so wait for that tag there.
      - name: Wait for the QEMU image
        env:
          QEMU_IMAGE: ${{ steps.qemu.outputs.image }}
          REF: ${{ github.ref }}
        run: |
          tries=1
          if [ "${REF}" = refs/heads/master ]; then
            tries=40
          fi
          for i in $(seq "${tries}"); do
            if docker manifest inspect "${QEMU_IMAGE}" > /dev/null 2>&1; then
              echo "found ${QEMU_IMAGE}"
              exit 0
            fi
            if [ "${i}" -lt "${tries}" ]; then
              sleep 30
            fi
          done
          echo "::error::${QEMU_IMAGE} does not exist. Run the workflow that publishes the qemu-build image for this branch, then run this job again."
          exit 1
      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: QEMU_IMAGE=${{ steps.qemu.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Select image for live tests
        id: ref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # the immutable short-SHA tag identifies exactly this build
          image="$(echo "$TAGS" | grep -E ':[0-9a-f]{7,}$' | head -1)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "live tests will use ${image}"

  live-tests:
    name: Live tests
    needs: push-to-ghcr
    # The 22-VM run is costly: test pull requests and master, not every branch
    # push. A same-repo pull request gets both events, so this also runs once
    # per commit instead of twice.
    # push-to-ghcr is skipped for pull requests, which build the image in the
    # live test job.
    if: >-
      !cancelled() && needs.push-to-ghcr.result != 'failure' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/live.yml
    with:
      # empty for pull requests: live.yml builds the checked-out code
      image: ${{ needs.push-to-ghcr.outputs.image }}
