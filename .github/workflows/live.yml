name: Live Tests

# End-to-end tests that run a real minimega deployment from a Docker image,
# boot a 22-VM KVM topology (tests/live/topology.mm), and exercise it over the
# command socket. See tests/live/README.md.
#
# Called by the Docker workflow with the image it just built, or run by hand
# against any published image.

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to test
        required: true
        type: string
      image-artifact:
        description: Name of an artifact holding the image as a gzipped "docker save" tarball (used when the image was not pushed)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: Image reference to test
        required: true
        default: ghcr.io/sandia-minimega/minimega:master
        type: string

permissions:
  contents: read
  packages: read

jobs:
  live:
    name: Live tests (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check host support (KVM, Open vSwitch)
        run: |
          # GitHub-hosted Linux runners expose /dev/kvm; make it usable and
          # load the Open vSwitch datapath the container's ovs-ctl needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe openvswitch
          lsmod | grep -E '^(kvm|openvswitch)'
          nproc; free -h

      - name: Download image artifact
        if: inputs.image-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image

      - name: Load image artifact
        if: inputs.image-artifact != ''
        run: |
          gunzip -c "${{ runner.temp }}/image/minimega-image.tar.gz" | docker load
          rm -rf "${{ runner.temp }}/image"
          echo "LIVE_PULL=0" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: inputs.image-artifact == '' && startsWith(inputs.image, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test binary
        run: GOFLAGS=-mod=vendor go test -c -tags live -o "${{ runner.temp }}/live.test" ./tests/live

      - name: Run live tests
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,LIVE_PULL \
            LIVE_TEST_BIN="${{ runner.temp }}/live.test" \
            LIVE_ARTIFACTS="${{ github.workspace }}/live-artifacts" \
            tests/live/run.sh "$IMAGE"

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" live-artifacts || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-artifacts
          path: live-artifacts
          retention-days: 14
          if-no-files-found: warn
