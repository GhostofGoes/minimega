name: Live Tests

# End-to-end tests that run a real minimega deployment from a Docker image,
# boot a 22-VM KVM topology (tests/live/core/topology.mm), and exercise it over the
# command socket. See tests/live/README.md.
#
# Called by the Docker workflow: on master with the image it just pushed, on
# pull requests with no image, so this job builds the checked-out code from
# docker/Dockerfile and tests it in the same job. Run by hand (Actions > Live
# Tests > Run workflow, or `gh workflow run live.yml --ref <branch>`), it
# builds the dispatched branch the same way, so it works on a fork without a
# pull request. Set "image" to test an existing image instead.
#
# The image build copies QEMU from the published qemu-build image. When a pull
# request changes docker/qemu/ (or "build_qemu" is set on a manual run), the
# job first builds docker/qemu/Dockerfile and uses that local image instead.

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to test (empty builds the checked-out code)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: Image to test, e.g. ghcr.io/sandia-minimega/minimega:master (empty builds this branch)
        required: false
        default: ""
        type: string
      qemu_source:
        description: QEMU source for the image build (upstream or distro)
        required: false
        default: upstream
        type: choice
        options:
          - upstream
          - distro
      expected_qemu:
        description: Expected QEMU version (empty uses ARG QEMU_VERSION in docker/qemu/Dockerfile; with distro, empty skips the comparison)
        required: false
        default: ""
        type: string
      build_qemu:
        description: Build docker/qemu/Dockerfile in this job instead of using the published qemu-build image
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  live:
    name: Live tests (KVM)
    runs-on: ubuntu-latest
    # a local QEMU build (see build_qemu) adds about 20 minutes
    timeout-minutes: 90
    env:
      IMAGE: ${{ inputs.image || 'minimega:live' }}
      BUILD: ${{ inputs.image == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the image build reads the version from git
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        run: |
          # the image, its guest build and 22 VMs need room; drop preinstalled
          # toolchains we do not use
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Check host support (KVM, Open vSwitch)
        run: |
          # GitHub-hosted Linux runners expose /dev/kvm; make it usable and
          # load the Open vSwitch datapath the container's ovs-ctl needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe openvswitch
          lsmod | grep -E '^(kvm|openvswitch)'
          nproc; free -h

      # A fork uses the qemu-build image from its own registry.
      - name: Select QEMU image and version
        id: qemu
        env:
          OWNER: ${{ github.repository_owner }}
          EXPECTED_QEMU: ${{ inputs.expected_qemu }}
          QEMU_SOURCE: ${{ inputs.qemu_source || 'upstream' }}
        run: |
          version="$(sed -n 's/^ARG QEMU_VERSION="\([^"]*\)"$/\1/p' docker/qemu/Dockerfile)"
          revision="$(sed -n 's/^ARG QEMU_BUILD_REVISION="\([^"]*\)"$/\1/p' docker/qemu/Dockerfile)"
          if [ -z "${version}" ] || [ -z "${revision}" ]; then
            echo "::error::cannot read ARG QEMU_VERSION and ARG QEMU_BUILD_REVISION from docker/qemu/Dockerfile"
            exit 1
          fi
          echo "image=ghcr.io/${OWNER,,}/qemu-build:${version}-noble-${revision}" >> "$GITHUB_OUTPUT"
          # the Ubuntu packages have their own version
          if [ "${QEMU_SOURCE}" = distro ]; then
            version=""
          fi
          echo "version=${EXPECTED_QEMU:-${version}}" >> "$GITHUB_OUTPUT"

      # The published qemu-build tag does not contain a change to the recipe.
      - name: Check for QEMU recipe changes
        id: recipe
        if: env.BUILD == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BUILD_QEMU: ${{ inputs.build_qemu }}
          QEMU_SOURCE: ${{ inputs.qemu_source || 'upstream' }}
        run: |
          build=false
          if [ "${QEMU_SOURCE}" = distro ]; then
            echo "QEMU_SOURCE=distro does not use the qemu-build image"
          elif [ "${BUILD_QEMU}" = true ]; then
            echo "build_qemu is set"
            build=true
          elif [ "${EVENT}" = pull_request ]; then
            # HEAD is the merge commit of the pull request
            if git diff --quiet "${BASE_SHA}" HEAD -- docker/qemu/; then
              echo "docker/qemu/ is the same as in ${BASE_SHA}"
            else
              status=$?
              if [ "${status}" -ne 1 ]; then
                echo "::error::cannot compare docker/qemu/ with ${BASE_SHA}"
                exit 1
              fi
              echo "the pull request changes docker/qemu/"
              build=true
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

      # The image build pulls the qemu-build image, which can be private.
      - name: Log in to GitHub Container Registry
        if: env.BUILD == 'true' || startsWith(env.IMAGE, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The job uses the default builder (Docker driver), so the next build
      # resolves "FROM qemu-build:local" from the local image store.
      - name: Build QEMU image
        if: steps.recipe.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/qemu
          file: docker/qemu/Dockerfile
          push: false
          load: true
          tags: qemu-build:local

      - name: Build container image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            QEMU_IMAGE=${{ steps.recipe.outputs.build == 'true' && 'qemu-build:local' || steps.qemu.outputs.image }}
            QEMU_SOURCE=${{ inputs.qemu_source || 'upstream' }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Use the local image
        if: env.BUILD == 'true'
        run: echo "LIVE_PULL=0" >> "$GITHUB_ENV"

      - name: Build test binary
        run: go test -c -tags live -o "${{ runner.temp }}/live.test" ./tests/live/core

      - name: Run live tests
        env:
          LIVE_QEMU_VERSION: ${{ steps.qemu.outputs.version }}
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,LIVE_PULL,LIVE_QEMU_VERSION \
            LIVE_TEST_BIN="${{ runner.temp }}/live.test" \
            LIVE_ARTIFACTS="${{ github.workspace }}/live-artifacts" \
            tests/live/run.sh "$IMAGE"

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" live-artifacts || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-artifacts
          path: live-artifacts
          retention-days: 14
          if-no-files-found: warn
