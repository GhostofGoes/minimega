name: Build Binaries
on:
  push:
  workflow_call:
  release:
    types: [published]

jobs:
  build:
      name: Build Binaries
      runs-on: ubuntu-latest
      steps:
        - name: Harden Runner
          uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
          with:
            egress-policy: audit
        - name: Checkout
          uses: actions/checkout@v6
          with:
            path: minimega
        - name: Build
          run: |
            sudo apt-get update
            sudo apt-get install -y build-essential dnsmasq iproute2 isc-dhcp-client libpcap-dev ntfs-3g openssh-client openvswitch-switch qemu-kvm qemu-utils
            cd minimega
            ./scripts/all.bash
        # Only for release:
        - name: Tar
          if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
          run: tar -czvf minimega-$( cat minimega/VERSION | cut -d'=' -f2 )-binaries.tar.gz minimega
        - name: Upload artifact
          uses: actions/upload-artifact@v7.0.1
          if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
          with:
            name: minimega-binaries
            path: ./*.tar.gz
        - name: Upload python package
          uses: actions/upload-artifact@v7.0.1
          if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
          with:
            name: minimega-python-dist
            path: ./minimega/lib/dist/
