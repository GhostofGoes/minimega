services:
  minimega:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: minimega
    container_name: minimega
    hostname: minimega
    privileged: true
    cap_add:
    - ALL
    restart: always
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    ports:
    - 9000:9000/udp
    - 9001:9001
    volumes:
    - /dev:/dev
    - /lib/modules:/lib/modules:ro
    - /etc/localtime:/etc/localtime:ro
    - /tmp/minimega:/tmp/minimega
    - /var/log/minimega:/var/log/minimega
    - /var/lib/minimega/firecracker:/var/lib/minimega/firecracker
    healthcheck:
      test: mm version
